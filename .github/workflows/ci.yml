name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify runner starts
        shell: bash
        run: |
          echo "runner-ok"
          uname -a

  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate non-breaking production audit fixes
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --omit=dev --package-lock-only || true

      - name: Verify patched lockfile, audit, typecheck, and production build
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== npm ci =="
            npm ci
            echo "== npm audit --omit=dev =="
            npm audit --omit=dev || true
            echo "== npm run check =="
            npm run check
            echo "== npm run build =="
            npm run build
          } 2>&1 | tee ci-verification.log

      - name: Capture production audit JSON
        if: always()
        shell: bash
        run: npm audit --omit=dev --json > npm-audit-production.json || true

      - name: Upload CI verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification
          path: |
            ci-verification.log
            npm-audit-production.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 3
