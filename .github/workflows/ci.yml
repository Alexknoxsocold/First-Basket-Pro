name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify runner starts
        shell: bash
        run: |
          echo "runner-ok"
          uname -a

  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile and verify
        shell: bash
        run: |
          set -o pipefail
          {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
            npm run check
            npm run build
          } 2>&1 | tee ci-verification.log

      - name: Commit synchronized lockfile to research branch
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Synchronize package lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload CI verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-log
          path: ci-verification.log
          if-no-files-found: warn
          retention-days: 3
