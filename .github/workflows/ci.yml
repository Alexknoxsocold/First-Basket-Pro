name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-smoke:
    name: Runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify runner starts
        shell: bash
        run: |
          echo "runner-ok"
          uname -a

  build:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile and verify clean install, typecheck, and build
        shell: bash
        run: |
          set -o pipefail
          {
            echo "== regenerate package-lock.json from package.json =="
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "== npm ci =="
            npm ci
            echo "== npm run check =="
            npm run check
            echo "== npm run build =="
            npm run build
          } 2>&1 | tee ci-verification.log

      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload CI verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-verification-log
          path: ci-verification.log
          if-no-files-found: warn
          retention-days: 3
